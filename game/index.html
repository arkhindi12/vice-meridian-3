<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vice Meridian III</title>
<meta name="description" content="Vice Meridian III — an open-world crime game in one browser canvas: ten missions, a named cast, five stars and a helicopter, a GPS route painted on the asphalt, a full day and night cycle, cars that burn and explode, and a city of taxi ranks, tapes, resprays and stunt ramps.">
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #05040a;
    overflow: hidden;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: "DejaVu Sans", "Liberation Sans", Arial, Helvetica, sans-serif;
    color: #fff6ea;
  }
  #stage {
    position: relative;
    box-shadow: 0 0 120px rgba(255, 47, 134, 0.10);
  }
  #scene, #overlay {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
  }
  #scene { cursor: crosshair; touch-action: none; }
  #overlay { pointer-events: none; }
  /* The readable status line for a screen reader: never seen, never taking layout. */
  #status {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip-path: inset(50%);
    white-space: nowrap;
  }
</style>
</head>
<body>
<div id="stage">
  <canvas id="scene" aria-label="Vice Meridian III, an open-world crime game. WASD to walk and to drive, shift to run, E to take or leave a car, to buy at a shop or to start a side job, the left mouse button to shoot, R to reload, TAB for the next radio station, M to mute."></canvas>
  <canvas id="overlay" aria-hidden="true"></canvas>
</div>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
